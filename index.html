<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Earn Master</title>

<script src='//libtl.com/sdk.js' data-zone='11695469' data-sdk='show_11695469'></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f4f6fb;
color:#222;
}

.container{
max-width:480px;
margin:auto;
padding:18px;
}

.header{
background:linear-gradient(135deg,#6c5ce7,#4834d4);
color:white;
padding:25px 20px;
border-radius:20px;
text-align:center;
margin-bottom:18px;
}

.header h1{
font-size:27px;
margin-bottom:8px;
}

.balance{
font-size:30px;
font-weight:bold;
margin-top:8px;
}

.card{
background:white;
border-radius:18px;
padding:18px;
margin-bottom:15px;
box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.card h2{
font-size:18px;
margin-bottom:12px;
}

button{
width:100%;
border:0;
padding:14px;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:9px;
}

.watch{
background:#6c5ce7;
color:white;
}

.auto{
background:#00b894;
color:white;
}

.stop{
background:#d63031;
color:white;
}

.youtube{
background:#ff0000;
color:white;
}

.stats{
display:flex;
gap:10px;
}

.stat{
flex:1;
background:#f7f7f7;
padding:14px;
border-radius:12px;
text-align:center;
}

.stat b{
display:block;
font-size:20px;
margin-top:5px;
}

.status{
text-align:center;
font-size:13px;
color:#777;
margin-top:12px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>💰 Earn Master</h1>

<p>Watch Ads &amp; Earn Rewards</p>

<div class="balance">
<span id="balance">0.00</span> Points
</div>

</div>


<div class="card">

<h2>📊 Account Statistics</h2>

<div class="stats">

<div class="stat">
Ads Watched
<b id="adsWatched">0</b>
</div>

<div class="stat">
Points
<b id="points">0.00</b>
</div>

</div>

</div>


<div class="card">

<h2>📺 Watch Ads</h2>

<button class="watch" id="watchBtn">
▶ Watch Ad
</button>

<button class="auto" id="autoBtn">
🔄 Auto Ad
</button>

<button class="stop" id="stopBtn">
⛔ Stop Auto Ad
</button>

<div class="status" id="status">
Ready
</div>

</div>


<div class="card">

<h2>📢 YouTube Channel</h2>

<button class="youtube" id="youtubeBtn">
▶ Visit Channel
</button>

</div>

</div>


<script>

let balance =
Number(localStorage.getItem("balance")) || 0;

let adsWatched =
Number(localStorage.getItem("adsWatched")) || 0;

let autoRunning = false;

const REWARD = 0.10;


function updateUI(){

document.getElementById("balance")
.textContent = balance.toFixed(2);

document.getElementById("points")
.textContent = balance.toFixed(2);

document.getElementById("adsWatched")
.textContent = adsWatched;

localStorage.setItem(
"balance",
balance
);

localStorage.setItem(
"adsWatched",
adsWatched
);

}


function setStatus(message){

document.getElementById("status")
.textContent = message;

}


async function watchAd(){

if(
typeof window.show_11695469 !==
"function"
){

setStatus(
"Monetag is loading..."
);

alert(
"Monetag is loading. Please wait a few seconds and try again."
);

return;

}


setStatus(
"Advertisement is opening..."
);


try{

await window.show_11695469();


/*
Reward is added after the
Monetag promise completes.
*/

balance += REWARD;

adsWatched++;

updateUI();

setStatus(
"Ad completed successfully!"
);


if(autoRunning){

setTimeout(
function(){

if(autoRunning){
watchAd();
}

},
1500
);

}

}
catch(error){

console.log(
"Monetag error:",
error
);

setStatus(
"Ad was not completed."
);

}

}


function startAuto(){

if(autoRunning){
return;
}

autoRunning = true;

setStatus(
"Auto Ad started"
);

watchAd();

}


function stopAuto(){

autoRunning = false;

setStatus(
"Auto Ad stopped"
);

}


document
.getElementById("watchBtn")
.addEventListener(
"click",
watchAd
);


document
.getElementById("autoBtn")
.addEventListener(
"click",
startAuto
);


document
.getElementById("stopBtn")
.addEventListener(
"click",
stopAuto
);


document
.getElementById("youtubeBtn")
.addEventListener(
"click",
function(){

window.open(
"https://youtube.com/",
"_blank"
);

}
);


updateUI();

</script>

</body>
</html>
